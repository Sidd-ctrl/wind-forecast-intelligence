services:
  backend:
    build:
      context: ./backend
    image: aeron-backend:local
    container_name: aeron-backend
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      ELEXON_BASE_URL: ${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      ELEXON_TIMEOUT_SECONDS: ${ELEXON_TIMEOUT_SECONDS:-30}
      ELEXON_MAX_RETRIES: ${ELEXON_MAX_RETRIES:-3}
      ELEXON_MAX_CHUNK_DAYS: ${ELEXON_MAX_CHUNK_DAYS:-7}
      ANALYSIS_START_DATE: ${ANALYSIS_START_DATE:-2026-01-01}
      ANALYSIS_END_DATE: ${ANALYSIS_END_DATE:-2026-01-31}
      DEFAULT_LEAD_HOURS: ${DEFAULT_LEAD_HOURS:-12}
      ALLOWED_LEAD_HOURS: ${ALLOWED_LEAD_HOURS:-4,8,12,24,36,48}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DIR: /tmp/aeron-cache
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-https://([a-z0-9-]+\.)*vercel\.app}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: aeron-frontend:local
    container_name: aeron-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
